[package]
name = "gree-climate"
version = "0.1.0"
edition = "2024"
authors = ["Michele Broggi"]
description = "Async Rust library for controlling GREE air conditioners over LAN"
license = "MIT"
repository = "https://github.com/thesmokinator/gree-climate"
readme = "README.md"
keywords = ["gree", "hvac", "climate", "ac", "air-conditioner"]
categories = ["api-bindings", "hardware-support", "network-programming"]

[dependencies]
tokio = { version = "1", features = ["net", "time", "sync", "macros", "rt", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
thiserror = "2"
aes = "0.8"
aes-gcm = "0.10"
base64 = "0.22"
tracing = "0.1"
socket2 = "0.5"

[dev-dependencies]
tokio = { version = "1", features = ["net", "time", "sync", "macros", "rt", "test-util"] }
tracing-subscriber = "0.3"

[[example]]
name = "discover"
path = "examples/discover.rs"

[[example]]
name = "control"
path = "examples/control.rs"
